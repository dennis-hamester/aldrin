[package]
name = "aldrin-parser-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
doc = false
name = "single"
path = "fuzz_targets/single.rs"
test = false

[[bin]]
doc = false
name = "multi"
path = "fuzz_targets/multi.rs"
test = false

[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.aldrin-parser]
path = ".."

[dependencies.arbitrary]
version = "1.5.0"
features = ["derive"]

[workspace]

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true
codegen-units = 1
