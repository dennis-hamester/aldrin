name: CI

on:
  push:
    branches-ignore:
    - 'wip/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:

  packages:
    name: List workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: List packages
        id: list
        run: echo "packages=$(cargo metadata --no-deps --format-version 1 | jq -c '[.packages[].name]')" >> "$GITHUB_OUTPUT"

  clippy:
    name: Clippy (${{ matrix.package }})
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.package }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Clippy (feature powerset)
        run: cargo hack clippy --locked -p ${{ matrix.package }} --feature-powerset --depth 2 --all-targets
      - name: Clippy (all features)
        run: cargo hack clippy --locked -p ${{ matrix.package }} --all-features --all-targets

  check-msrv:
    name: Check (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # No --locked below: it must not be combined with --no-dev-deps.
      - name: Check (workspace, without dev-dependencies, feature powerset)
        run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps
      - name: Check (workspace, without dev-dependencies, all features)
        run: cargo hack check --workspace --all-features --no-dev-deps

  minimal-versions:
    name: Check minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Resolve direct dependencies to minimal versions
        run: cargo +nightly update -Z direct-minimal-versions
      # No --locked below: the lock file was just rewritten by the previous step, and it must not be
      # combined with --no-dev-deps anyway.
      - name: Check (workspace, without dev-dependencies, feature powerset)
        run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps
      - name: Check (workspace, without dev-dependencies, all features)
        run: cargo hack check --workspace --all-features --no-dev-deps

  test:
    name: Test (${{ matrix.package }}, ${{ matrix.rust }})
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
        rust:
          - stable
          - 1.94.1
        include:
          - rust: stable
            depth: 2
          - rust: 1.94.1
            depth: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.rust }}-${{ matrix.package }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Test (feature powerset)
        run: cargo hack test --locked -p ${{ matrix.package }} --feature-powerset --depth ${{ matrix.depth }}
      - name: Test (all features)
        run: cargo hack test --locked -p ${{ matrix.package }} --all-features

  doc:
    name: Check docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo doc (no default features)
        run: cargo doc --locked --workspace --no-deps --no-default-features
      - name: Cargo doc (all features)
        run: cargo doc --locked --workspace --no-deps --all-features

  style:
    name: Code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt -- --check

  style-toml:
    name: TOML formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Tombi
        uses: tombi-toml/setup-tombi@v1
        with:
          version: 1.11.3
      - name: Tombi format
        run: tombi format --check
      - name: Tombi lint
        run: tombi lint

  style-aldrin:
    name: Schema formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build aldrin-gen
        run: cargo build --locked -p aldrin-gen
      # Only the examples are checked. Schemas in test directories are intentionally unformatted or invalid.
      - name: Check schema formatting
        run: |
          status=0
          while IFS= read -r -d '' schema; do
            echo "==> $schema"
            target/debug/aldrin-gen fmt --check "$schema" || status=1
          done < <(find examples -name '*.aldrin' -print0 | sort -z)
          exit $status

  conformance:
    name: Protocol conformance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build aldrin-conformance-tester
        run: cargo build --locked -p aldrin-conformance-tester
      - name: Build conformance-test-broker
        run: cargo build --locked -p conformance-test-broker
      - name: Run conformance tests
        run: target/debug/aldrin-conformance-tester run -j1 target/debug/conformance-test-broker

  cargo-deny:
    name: Check cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Advisories are checked on a schedule in audit.yaml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  machete:
    name: Check unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete
      - name: Cargo machete
        run: cargo machete --skip-patterns fuzz

  miri:
    name: Test ${{ matrix.package }} under Miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - aldrin
          - aldrin-core
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri-${{ matrix.package }}
      - name: Run tests under miri
        run: cargo miri test --locked --all-features -p ${{ matrix.package }}

  fuzz:
    name: Check fuzz targets (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - broker
          - core
          - parser
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Check fuzz targets
        working-directory: ${{ matrix.crate }}/fuzz
        # No --locked: the fuzz crates' lock files are gitignored.
        run: cargo check --all-targets --all-features
