name: CI

on:
  push:
    branches-ignore:
    - 'wip/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:

  clippy:
    name: Clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            depth: 2
          - rust: 1.94.1
            depth: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Clippy (workspace, feature powerset)
        run: cargo hack clippy --locked --workspace --feature-powerset --depth ${{ matrix.depth }} --all-targets
      - name: Clippy (workspace, all features)
        run: cargo hack clippy --locked --workspace --all-features --all-targets
      - name: Clippy (workspace, without dev-dependencies, feature powerset)
        run: cargo hack clippy --workspace --feature-powerset --depth ${{ matrix.depth }} --no-dev-deps
      - name: Clippy (workspace, without dev-dependencies, all features)
        run: cargo hack clippy --workspace --all-features --no-dev-deps

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            depth: 2
          - rust: 1.94.1
            depth: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Test (workspace, feature powerset)
        run: cargo hack test --locked --workspace --feature-powerset --depth ${{ matrix.depth }}
      - name: Test (workspace, all features)
        run: cargo hack test --locked --workspace --all-features

  doc:
    name: Check docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Cargo doc (no default features)
        run: cargo hack doc --locked --workspace --no-deps --no-default-features
      - name: Cargo doc (all features)
        run: cargo hack doc --locked --workspace --no-deps --all-features

  style:
    name: Code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt -- --check

  style-toml:
    name: TOML formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tombi
        uses: tombi-toml/setup-tombi@v1
        with:
          version: 1.11.3
      - name: Tombi format
        run: tombi format --check
      - name: Tombi lint
        run: tombi lint

  style-aldrin:
    name: Schema formatting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema:
          - examples/bookmarks/src/bookmarks_v1.aldrin
          - examples/bookmarks/src/bookmarks_v2.aldrin
          - examples/downloader/src/downloader.aldrin
          - examples/echo/src/echo.aldrin
          - examples/media-player/src/media_player.aldrin
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build aldrin-gen
        run: cargo build --locked -p aldrin-gen
      - name: Check schema formatting
        run: cargo run --locked -p aldrin-gen -- fmt --check ${{ matrix.schema }}

  conformance:
    name: Protocol conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build aldrin-conformance-tester
        run: cargo build --locked -p aldrin-conformance-tester
      - name: Build conformance-test-broker
        run: cargo build --locked -p conformance-test-broker
      - name: Run conformance tests
        run: target/debug/aldrin-conformance-tester run -j1 target/debug/conformance-test-broker

  cargo-deny:
    name: Check cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  machete:
    name: Check unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete
      - name: Cargo machete
        run: cargo machete --skip-patterns fuzz

  miri-aldrin:
    name: Test aldrin under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests under miri
        run: cargo miri test --locked --all-features -p aldrin

  miri-aldrin-core:
    name: Test aldrin-core under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests under miri
        run: cargo miri test --locked --all-features -p aldrin-core
