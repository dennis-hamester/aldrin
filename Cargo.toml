[workspace]
resolver = "3"
members = [
    "aldrin",
    "broker",
    "codegen",
    "conformance-test-broker",
    "conformance-tester",
    "core",
    "examples/bookmarks",
    "examples/broker",
    "examples/downloader",
    "examples/echo",
    "examples/introspect",
    "examples/media-player",
    "gen",
    "macros",
    "parser",
    "test",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
repository = "https://github.com/dennis-hamester/aldrin"
license = "MIT OR Apache-2.0"
keywords = [
    "async",
    "network",
    "rpc",
    "service",
]
categories = [
    "asynchronous",
    "network-programming",
]

[workspace.dependencies]
anstyle = { version = "1.0.14", default-features = false }
colorchoice-clap = { version = "1.0.8", default-features = false }
comrak = { version = "0.59.0", default-features = false }
diffy = { version = "0.5.2", default-features = false }
futures-channel = { version = "0.3.34", default-features = false }
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
heck = { version = "0.5.0", default-features = false }
terminal_size = { version = "0.4.4", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false }
uuid = { version = "1.29.0", default-features = false }

[workspace.dependencies.anstream]
version = "1.0.0"
default-features = false
features = ["auto"]

[workspace.dependencies.anyhow]
version = "1.0.104"
default-features = false
features = ["std"]

[workspace.dependencies.clap]
version = "4.6.7"
default-features = false
features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
    "wrap_help",
]

[workspace.dependencies.serde]
version = "1.0.229"
default-features = false
features = [
    "derive",
    "std",
]

[workspace.lints.clippy]
allow_attributes = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_possible_wrap = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
doc_paragraphs_missing_punctuation = "warn"
elidable_lifetime_names = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
inconsistent_struct_constructor = "warn"
into_iter_without_iter = "warn"
items_after_statements = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
mismatching_type_param_order = "warn"
missing_fields_in_debug = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
needless_type_cast = "warn"
non_std_lazy_statics = "warn"
nonminimal_bool = "warn"
option_as_ref_cloned = "warn"
or_fun_call = "warn"
ptr_as_ptr = "warn"
pub_without_shorthand = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
ref_option = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
search_is_some = "warn"
semicolon_if_nothing_returned = "warn"
set_contains_or_insert = "warn"
should_panic_without_expect = "warn"
single_char_pattern = "warn"
str_to_string = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
trivially_copy_pass_by_ref = "warn"
type_repetition_in_bounds = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_async = "warn"
unused_result_ok = "warn"
unused_self = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
with_capacity_zero = "warn"
zero_sized_map_values = "warn"

[workspace.lints.rust]
closure_returning_async_block = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
