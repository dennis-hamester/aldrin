[package]
name = "example-introspect"
version = "0.0.0"
publish = false

edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["introspection"]
introspection = ["aldrin/introspection"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }

[dependencies.aldrin]
path = "../../aldrin"
default-features = false
features = ["tokio"]

[dependencies.tokio]
workspace = true
features = [
    "macros",
    "net",
    "rt-multi-thread",
]

[lints]
workspace = true
