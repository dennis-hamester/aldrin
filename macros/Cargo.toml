[package]
name = "aldrin-macros"
version = "0.15.0"
description = "Aldrin macros."

edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.playground]
all-features = true

[lib]
proc-macro = true

[dependencies]
heck = { workspace = true }

[dependencies.aldrin-codegen]
path = "../codegen"
version = "0.15.0"
default-features = false
features = ["rust"]

[dependencies.aldrin-parser]
path = "../parser"
version = "0.15.0"
default-features = false

[dependencies.proc-macro2]
version = "1.0.107"
default-features = false

[dependencies.quote]
version = "1.0.47"
default-features = false

[dependencies.syn]
version = "3.0.9"
default-features = false
features = [
    "clone-impls",
    "derive",
    "extra-traits",
    "parsing",
    "printing",
    "proc-macro",
    "visit-mut",
]

[dev-dependencies.aldrin]
path = "../aldrin"
default-features = false
features = [
    "introspection",
    "macros",
]

[dev-dependencies.aldrin-core]
path = "../core"
default-features = false
features = [
    "derive",
    "introspection",
]

[dev-dependencies.uuid]
workspace = true

[lints]
workspace = true
