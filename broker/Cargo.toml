[package]
name = "aldrin-broker"
version = "0.15.0"
description = """
Broker library of Aldrin, a message bus for service-oriented RPC and interprocess communication.
"""

edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.playground]
all-features = true

[features]
channel = ["aldrin-core/channel"]
introspection = [
    "dep:rand",
    "aldrin-core/introspection",
]
serde = ["aldrin-core/serde"]
statistics = []
tokio = ["aldrin-core/tokio"]

[dependencies]
thiserror = { workspace = true }

[dependencies.aldrin-core]
path = "../core"
version = "0.15.0"
default-features = false
features = ["new-v4-ids"]

[dependencies.futures-channel]
workspace = true
features = [
    "sink",
    "std",
]

[dependencies.futures-util]
workspace = true
features = ["sink"]

[dependencies.rand]
version = "0.10.3"
default-features = false
features = ["sys_rng"]
optional = true

[dev-dependencies]
anyhow = { workspace = true }

[dev-dependencies.aldrin]
path = "../aldrin"
default-features = false

[dev-dependencies.aldrin-core]
path = "../core"
default-features = false
features = [
    "channel",
    "tokio",
]

[dev-dependencies.aldrin-test]
path = "../test"
default-features = false
features = ["tokio"]

[dev-dependencies.tokio]
workspace = true
features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
]

[lints]
workspace = true
