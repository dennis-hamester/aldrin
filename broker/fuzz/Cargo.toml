[package]
name = "aldrin-broker-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
introspection = ["aldrin-broker/introspection"]

[[bin]]
doc = false
name = "broker"
path = "fuzz_targets/broker.rs"
test = false

[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.aldrin-broker]
path = "../../broker"
features = [
    "channel",
    "statistics",
]

[dependencies.aldrin-core]
path = "../../core"
features = ["fuzzing"]

[dependencies.arbitrary]
version = "1.5.0"
features = ["derive"]

[dependencies.uuid]
version = "1.29.0"
features = ["arbitrary"]

[workspace]

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true
codegen-units = 1
