[package]
name = "aldrin"
version = "0.15.0"
description = "Message bus for service-oriented RPC and interprocess communication."

edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.playground]
all-features = true

[features]
channel = ["aldrin-core/channel"]
introspection = ["aldrin-core/introspection"]
macros = ["dep:aldrin-macros"]
new-v4-ids = ["aldrin-core/new-v4-ids"]
serde = [
    "dep:serde",
    "aldrin-core/serde",
]
sink = ["dep:futures-sink"]
tokio = ["aldrin-core/tokio"]

[dependencies]
futures-core = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }

[dependencies.aldrin-core]
path = "../core"
version = "0.15.0"
default-features = false
features = ["new-v4-ids"]

[dependencies.aldrin-macros]
path = "../macros"
version = "0.15.0"
default-features = false
optional = true

[dependencies.futures-channel]
workspace = true
features = ["std"]

[dependencies.futures-sink]
version = "0.3.34"
default-features = false
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.uuid]
workspace = true
features = ["v4"]

[dev-dependencies.aldrin-broker]
path = "../broker"
default-features = false
features = ["statistics"]

[dev-dependencies.aldrin-core]
path = "../core"
default-features = false
features = ["channel"]

[dev-dependencies.aldrin-test]
path = "../test"
default-features = false
features = ["tokio"]

[dev-dependencies.futures-util]
workspace = true
features = ["sink"]

[dev-dependencies.tokio]
workspace = true
features = [
    "macros",
    "rt-multi-thread",
    "time",
]

[lints]
workspace = true
